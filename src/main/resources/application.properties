spring.application.name=auth-service

server.port=8081
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true


# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:postgresql://postgres:5432/rapido_db
spring.datasource.username=${DB_USERNAME:rapido_user}
spring.datasource.password=${DB_PASSWORD:rapido_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# ===============================
# EUREKA CLIENT CONFIGURATION
# ===============================



eureka.client.register-with-eureka=true

eureka.client.fetch-registry=true


# ===============================
# JWT CONFIGURATION
# ===============================

jwt.secret=mySecretKeymySecretKeymySecretKey123456

jwt.expiration=86400000


# ===============================
# LOGGING
# ===============================

logging.level.org.springframework.security=DEBUG
spring.main.allow-bean-definition-overriding=true