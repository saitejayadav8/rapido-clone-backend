# =====================================
# APPLICATION
# =====================================

server.port=8084
spring.application.name=RIDE-SERVICE

# =====================================
# POSTGRESQL
# =====================================

spring.datasource.url=jdbc:postgresql://localhost:5432/rapido_db
spring.datasource.username=rapido_user
spring.datasource.password=rapido_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================
# JPA
# =====================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =====================================
# EUREKA
# =====================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# If Eureka is not running, uncomment:
# eureka.client.enabled=false

# =====================================
# ACTUATOR
# =====================================

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# =====================================
# PROMETHEUS
# =====================================

management.prometheus.metrics.export.enabled=true

# =====================================
# OPEN TELEMETRY (LOCAL)
# =====================================

otel.service.name=ride-service

# Disable OTEL locally
otel.sdk.disabled=true

# =====================================
# LOGGING
# =====================================

logging.pattern.level=%5p [traceId=%X{trace_id:-}, spanId=%X{span_id:-}]

# =====================================
# OAUTH2 RESOURCE SERVER
# =====================================

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/oauth2/jwks