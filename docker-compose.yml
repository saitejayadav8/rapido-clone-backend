services:

  postgres:
    image: postgres:15
    container_name: rapido-postgres
    environment:
      POSTGRES_DB: rapido_db
      POSTGRES_USER: rapido_user
      POSTGRES_PASSWORD: rapido_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - rapido-network
    restart: always

  redis:
    image: redis:7
    container_name: rapido-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - rapido-network
    restart: always

  rabbitmq:
    image: rabbitmq:management
    container_name: rapido-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - rapido-network
    restart: always

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8762:8761"
    networks:
      - rapido-network
    depends_on:
      - postgres
      - redis
      - rabbitmq
    restart: always

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "9090:9090"
    networks:
      - rapido-network
    depends_on:
      - eureka-server
    restart: always

  auth-service:
    build:
      context: ./auth-service
      dockerfile: ../Dockerfile.auth
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      DB_USERNAME: rapido_user
      DB_PASSWORD: rapido_pass
      JWT_SECRET: super_secret_key_for_rapido_backend
    networks:
      - rapido-network
    depends_on:
      - postgres
      - eureka-server
    restart: always

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8082:8082"
    environment:
      DB_USERNAME: rapido_user
      DB_PASSWORD: rapido_pass
    networks:
      - rapido-network
    depends_on:
      - postgres
      - eureka-server
    restart: always

  driver-service:
    build:
      context: ./driver-service
      dockerfile: Dockerfile
    container_name: driver-service
    ports:
      - "8083:8083"
    environment:
      DB_USERNAME: rapido_user
      DB_PASSWORD: rapido_pass
    networks:
      - rapido-network
    depends_on:
      - postgres
      - eureka-server
    restart: always

  ride-service:
    build:
      context: ./ride-service
      dockerfile: Dockerfile
    container_name: ride-service
    ports:
      - "8084:8084"
    environment:
      DB_USERNAME: rapido_user
      DB_PASSWORD: rapido_pass
    networks:
      - rapido-network
    depends_on:
      - postgres
      - eureka-server
      - rabbitmq
    restart: always

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "8085:8085"
    environment:
      DB_USERNAME: rapido_user
      DB_PASSWORD: rapido_pass
    networks:
      - rapido-network
    depends_on:
      - postgres
      - eureka-server
      - rabbitmq
    restart: always

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8086:8086"
    environment:
      DB_USERNAME: rapido_user
      DB_PASSWORD: rapido_pass
    networks:
      - rapido-network
    depends_on:
      - postgres
      - eureka-server
      - rabbitmq
    restart: always

networks:
  rapido-network:

volumes:
  postgres-data:
  redis-data: