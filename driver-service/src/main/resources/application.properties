spring.datasource.url=jdbc:postgresql://localhost:5432/rapido_db
spring.datasource.username=${DB_USERNAME:rapido_user}
spring.datasource.password=${DB_PASSWORD:rapido_pass}
spring.datasource.driver-class-name=org.postgresql.Driver
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.application.name=DRIVER-SERVICE
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true